# Este workflow foca na execução dos testes unitários da aplicação para garantir a integridade do código.
# A estrutura foi desenhada de forma simples, mas pronta para receber novos jobs no futuro.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: gabriel3-2455
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install
      - name: Run Unit Tests
        run: yarn test

  build-and-deploy:
    name: Build and Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy-preview.outputs.deployment-url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install
      - name: Setup Vercel CLI
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN
      - name: Deploy Vercel Preview
        id: deploy-preview
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install
      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium
      - name: Run E2E Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      - name: Archive Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-preview
          path: playwright-report/

  deploy-production:
    name: Deploy to Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy-prod.outputs.deployment-url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install
      - name: Pull Vercel Prod Config
        run: yarn vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
      - name: Build Vercel Prod
        run: yarn vercel build --prod --token=$VERCEL_TOKEN
      - name: Deploy Vercel Production
        id: deploy-prod
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --prod \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests-prod:
    name: Run E2E Tests on Production
    needs: [deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install
      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium
      - name: Run E2E Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.deploy-production.outputs.deployment-url }}
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      - name: Archive Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-production
          path: playwright-report/