# Este workflow foca na execução dos testes unitários da aplicação para garantir a integridade do código.
# A estrutura foi desenhada de forma simples, mas pronta para receber novos jobs no futuro.

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: gabriel3-2455
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Baixa o código-fonte do repositório para o runner
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o corepack, necessário para usar o Yarn moderno
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # Executa a suíte de testes unitários
      - name: Run Unit Tests
        run: yarn test

  build-and-deploy:
    name: Build and Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy-preview.outputs.deployment-url }}

    steps:
      # Baixa o código-fonte do repositório para o runner
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o corepack, necessário para usar o Yarn moderno
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # Configura o Vercel CLI com as variáveis de ambiente
      - name: Setup Vercel CLI
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # Executa a suíte de testes unitários
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # Executa a suíte de testes unitários
      - name: Deploy Vercel Preview
        id: deploy-preview
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    steps:
      # Baixa o código-fonte do repositório para o runner
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o corepack, necessário para usar o Yarn moderno
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # Instalação do chromium
      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      # Executa a suíte de testes e2e
      - name: Run E2E Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}

      # Arquivar resultados
      - name: Archive Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/